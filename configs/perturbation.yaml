# configs/perturbation.yaml

data:
  val_size: 0.30
  batch_size: 32
  fraction_gs: 0.1

model:
  dropout_prior: 0.05
  dropout_meta: 0.05
  dropout_decoder: 0.05

training:
  num_epochs: 200
  cvs: 5

refit:
  num_epochs: 50
  iterations: 10
  resample: true

optimizer:
  name: Adam
  learning_rate: 1e-4
  weight_decays:
    - 1e-10
  kwargs: {}
  parameter_kwargs: {}

scheduler:
  name: CosineAnnealingLR
  kwargs:
    T_max: 10

pruning:
  eps_factor: 10
  fill_zeroed: true

runtime:
  device: cuda:1
