[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kinaspire"
version = "0.1.0"
description = "Context-aware kinase activity inference from phosphoproteomics data."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["kinase", "phosphoproteomics", "activity inference", "deep learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy==1.22.4",
    "pandas==2.2.0",
    "scikit-learn==1.4.0",
    "tensorboard==2.15.1",
    "pyarrow==15.0.0",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
plot = [
    "matplotlib==3.6.3",
    "seaborn==0.13.2",
    "scipy==1.8.0",
]

[project.scripts]
kinaspire = "kinaspire.cli.main:main"
kinaspire-preprocess = "kinaspire.cli.preprocess:main"
kinaspire-train = "kinaspire.cli.train:main"
kinaspire-infer = "kinaspire.cli.infer:main"

[tool.setuptools.packages.find]
include = ["kinaspire*"]
exclude = ["examples*", "scripts*"]
